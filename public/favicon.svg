<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Squircle Badge -->
  <rect width="64" height="64" rx="18" fill="#111827"/>
  <!-- Subtle Inner Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" stroke="#2a3241" stroke-width="3"/>
  
  <!-- Connected Twin Music Notes (Two friends linked by music) -->
  <!-- Top Joining Beam with 3D drop depth -->
  <path d="M22 22 L46 16 V23 L22 29 Z" fill="#46A302"/>
  <path d="M22 20 L46 14 V20 L22 26 Z" fill="#58CC02"/>
  
  <!-- Left Note Stem -->
  <rect x="22" y="24" width="4.5" height="22" rx="2" fill="#58CC02"/>
  <!-- Left Note Head -->
  <ellipse cx="19" cy="45" rx="7" ry="5.5" transform="rotate(-20 19 45)" fill="#58CC02"/>
  <!-- Left Note Head Shine -->
  <circle cx="17.5" cy="43.5" r="1.8" fill="#ffffff" opacity="0.8"/>

  <!-- Right Note Stem -->
  <rect x="42" y="18" width="4.5" height="22" rx="2" fill="#58CC02"/>
  <!-- Right Note Head -->
  <ellipse cx="39" cy="39" rx="7" ry="5.5" transform="rotate(-20 39 39)" fill="#58CC02"/>
  <!-- Right Note Head Shine -->
  <circle cx="37.5" cy="37.5" r="1.8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Energy Sparkle (Live concert vibe) -->
  <circle cx="48" cy="11" r="3" fill="#58CC02"/>
</svg>
